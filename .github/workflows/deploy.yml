name: deploy

# Continuous delivery for the production host.
#   push to main  -> quality gates -> build + push images to GHCR -> SSH roll-out -> readiness
#   workflow_dispatch -> same pipeline for any ref (manual re-deploy)
# Required repository secret: DEPLOY_SSH_KEY (private key whose public half is in
# ~/.ssh/authorized_keys on the host). Optional overrides: DEPLOY_HOST (default
# 51.79.255.102) and DEPLOY_USER (default ubuntu).
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.project/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/rental-system

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  images:
    name: build images
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/deploy/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/deploy/Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: roll out
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ needs.images.outputs.tag }}
      # Host and user are not secrets; the repository secrets only override them.
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '51.79.255.102' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
    steps:
      - name: check the deploy key secret
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Repository secret DEPLOY_SSH_KEY is missing. Add the private key whose public half is in ~/.ssh/authorized_keys on ${DEPLOY_HOST} (Settings > Secrets and variables > Actions > Repository secrets), then re-run this job."
            exit 1
          fi
      - name: configure ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${DEPLOY_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIGB5cii3pKrd8fJPrcPnAK0oAmGRkhn2WB1kQbbBMsO" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
          EOF
          ssh production 'echo "ssh ok: $(hostname)"'
      # The packages are private; the host logs in with this job's token inside a dedicated
      # Docker config directory so the host's own ghcr.io credentials stay untouched.
      - name: log the host into GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh production "mkdir -p ~/rental-system/.docker \
            && chmod 700 ~/rental-system/.docker \
            && DOCKER_CONFIG=~/rental-system/.docker docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: pull and restart
        run: |
          ssh production "set -eu; cd ~/rental-system \
            && export DOCKER_CONFIG=~/rental-system/.docker \
            && sed -i -e 's/^TAG=.*/TAG=${TAG}/' -e 's/^APP_VERSION=.*/APP_VERSION=${TAG}/' .env \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans \
            && docker logout ghcr.io > /dev/null \
            && docker image prune -f > /dev/null"
      - name: wait for readiness
        run: |
          ssh production 'set -u; cd ~/rental-system; port=$(sed -n "s/^WEB_PORT=//p" .env); port=${port:-8180};
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/api/health/ready" > /dev/null; then
                echo "ready after ${attempt} attempts"; exit 0;
              fi
              sleep 5
            done
            echo "API not ready" >&2; docker compose logs --tail 100 api; exit 1'
      - name: smoke
        run: |
          ssh production 'cd ~/rental-system; port=$(sed -n "s/^WEB_PORT=//p" .env); port=${port:-8180};
            curl -fsS "http://127.0.0.1:${port}/api/health" && echo && curl -fsSI "http://127.0.0.1:${port}/" | head -1'
