# Production stack on the shared host. Copied to ~/rental-system/docker-compose.yml by
# deploy/server-setup.sh; images come from GHCR (CD) or from docker-compose.build.yml.
# `TAG`, `WEB_PORT` and the API settings are read from ~/rental-system/.env.
name: rental-system

services:
  api:
    image: ghcr.io/duylinhdang1998/rental-system-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3000'
      PRIVATE_FILE_DIR: /data/private
    volumes:
      - ./data/private:/data/private
    networks:
      - default
      - global_db_net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  web:
    image: ghcr.io/duylinhdang1998/rental-system-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WEB_PORT:-8180}:80
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  global_db_net:
    external: true
