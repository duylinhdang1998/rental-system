# /etc/nginx/sites-available/<DOMAIN>.conf on the host — installed by deploy/server-setup.sh.
# HTTP only; `sudo certbot --nginx -d <DOMAIN>` adds the 443 block once DNS points here.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
