# Admin bundle plus the /api reverse proxy, so the browser talks to one origin and the
# session cookie stays SameSite=Strict. The host nginx terminates TLS in front of this server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Return photos: up to 5 files of 2 MB per request (RETURN_PHOTO_LIMITS).
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the API service at request time so nginx starts even if the API restarts.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
